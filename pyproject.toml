[project]
name = "dotfiles"
version = "0.0.0"
description = "Tests for the dotfiles scripts"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "basedpyright",
  "pytest",
  "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["conftest"]

[tool.basedpyright]
include = ["tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
